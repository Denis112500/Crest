[package]
name = "fullscreen_event_watcher"
version = "0.0.0"
edition = "2021"
publish = false

# Same `windows` version as Crest, so what this probe finds holds for Crest too.
[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
