[package]
name = "claude_code_hook_probe"
version = "0.0.0"
edition = "2021"
publish = false

# Same `windows` version as Crest, so what this probe finds holds for Crest too.
# No other crates: the probe reads the few JSON fields it prints by hand.
[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
