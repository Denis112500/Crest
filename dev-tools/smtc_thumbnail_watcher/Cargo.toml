[package]
name = "smtc_thumbnail_watcher"
version = "0.0.0"
edition = "2021"
publish = false

# Same `windows` version as Crest, so its WinRT types behave the same.
[dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
