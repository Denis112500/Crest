[package]
name = "crest"
version = "0.3.1"
description = "A pill at the top of the screen that shows what's playing"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name different from the binary name;
# on Windows identical names collide (https://github.com/rust-lang/cargo/issues/8519).
name = "crest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"

# Same major version Tauri uses, so its HWND type is ours and only one copy compiles.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The WebView2 bindings Tauri itself uses (same version, so it isn't compiled twice); for
# settings Tauri doesn't expose, like the memory usage target level.
webview2-com = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
