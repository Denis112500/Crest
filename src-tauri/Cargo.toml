[package]
name = "crest"
version = "0.1.0"
description = "A pill at the top of the screen that shows what's playing"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name different from the binary name;
# on Windows identical names collide (https://github.com/rust-lang/cargo/issues/8519).
name = "crest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

# Same major version Tauri uses, so its HWND type is ours and only one copy compiles.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
